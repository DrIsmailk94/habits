<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habit Menu">
<meta name="theme-color" content="#1C2A22">
<title>Habit Menu</title>
<style>
  :root{
    --bg: #1C2A22;
    --bg-raised: #24352B;
    --bg-card: #2B3D32;
    --bg-card-hover: #324636;
    --border: rgba(243,239,228,0.12);
    --border-strong: rgba(243,239,228,0.22);
    --text: #F3EFE4;
    --text-muted: #A9B7AC;
    --text-faint: #7C8B7F;
    --gold: #D9A94E;
    --teal: #5FAFA2;
    --rose: #C0645F;
    --amber: #E0985C;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ padding-top: env(safe-area-inset-top); }
  body{
    margin:0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(217,169,78,0.06), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px calc(100px + env(safe-area-inset-bottom));
  }
  header{
    padding: 6px 2px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  header h1{
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  header p{
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
    line-height:1.5;
  }

  .tabbar{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:6px;
    background: var(--bg-raised);
    padding:4px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .tabbar button{
    border:none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 700;
    padding: 9px 3px;
    border-radius: 9px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    transition: background .15s, color .15s;
  }
  .tabbar button .ic{ font-size:15px; line-height:1; }
  .tabbar button .count{
    font-size:10px;
    font-weight:700;
    opacity: 0.75;
  }
  .tabbar button.active{ background: var(--bg-card); color: var(--text); }
  .tabbar button[data-tab="idea"].active{ box-shadow: inset 0 0 0 1px rgba(217,169,78,0.5); }
  .tabbar button[data-tab="active"].active{ box-shadow: inset 0 0 0 1px rgba(95,175,162,0.5); }
  .tabbar button[data-tab="struggling"].active{ box-shadow: inset 0 0 0 1px rgba(192,100,95,0.5); }
  .tabbar button[data-tab="mastered"].active{ box-shadow: inset 0 0 0 1px rgba(224,152,92,0.6); }

  .cat-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 2px 2px 12px;
    scrollbar-width: none;
  }
  .cat-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    cursor:pointer;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--text-muted);
    white-space:nowrap;
    user-select:none;
  }
  .chip .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .chip.selected{ color: var(--text); border-color: var(--border-strong); background: var(--bg-card); }
  .chip .x{ margin-left:2px; opacity:0.6; font-weight:700; }
  .chip .x:hover{ opacity:1; }

  .manage-row{ display:flex; justify-content:flex-end; margin-bottom:4px; }
  .link-btn{
    background:none; border:none; color: var(--text-faint); font-size:12px;
    cursor:pointer; padding:4px 2px; font-family: var(--font-body);
  }
  .link-btn:hover{ color: var(--text-muted); }

  .cat-group{ margin-bottom: 22px; }
  .cat-group h2{
    display:flex; align-items:center; gap:8px;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); font-weight: 700; margin: 0 0 8px 2px;
  }
  .cat-group h2 .dot{ width:9px; height:9px; border-radius:50%; }

  .habit-card{
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 12px;
    margin-bottom: 8px;
    transition: transform .15s ease, opacity .15s ease, background .15s;
  }
  .habit-card:hover{ background: var(--bg-card-hover); }
  .habit-card.leaving{ opacity:0; transform: scale(0.96) translateX(6px); }
  .habit-top{ display:flex; align-items:flex-start; gap:12px; }

  .check{
    flex: 0 0 auto; width: 24px; height: 24px; margin-top:1px;
    border-radius: 7px; border: 2px solid var(--border-strong);
    background: transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color: transparent; font-size: 15px; font-weight: 900;
    transition: all .15s;
  }
  .check:hover{ border-color: var(--gold); }
  .check.checked{ border-color: rgba(95,175,162,0.6); color: var(--teal); }
  .check.checked::after{ content:"✓"; }
  .status-icon{
    flex:0 0 auto; width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    font-size:15px; margin-top:1px;
  }

  .habit-main{ flex:1; min-width:0; }
  .habit-name{ font-size: 14.5px; font-weight: 600; line-height:1.35; margin: 0 0 5px; word-break: break-word; }
  .habit-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .imp{ display:inline-flex; gap:2px; align-items:center; }
  .imp .d{ width:6px; height:6px; border-radius:50%; background: var(--border-strong); }
  .imp .d.on{ background: var(--gold); }
  .imp-label{ font-size: 10.5px; color: var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }

  .cat-pill{
    appearance:none; -webkit-appearance:none;
    background: var(--bg-raised);
    color: var(--text-muted);
    border: 1.5px solid var(--border-strong);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 20px 3px 9px;
    font-family: var(--font-body);
    cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 9px top 55%, right 5px top 55%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }

  .habit-actions{ display:flex; gap:2px; flex:0 0 auto; }
  .icon-btn{
    background:none; border:none; color: var(--text-faint);
    cursor:pointer; padding:5px; border-radius:6px; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color: var(--text); background: rgba(243,239,228,0.08); }
  .icon-btn.danger:hover{ color: var(--rose); }
  .icon-btn.gold:hover{ color: var(--gold); }
  .icon-btn.teal:hover{ color: var(--teal); }

  .confirm-row{ display:flex; gap:6px; align-items:center; font-size:12px; color: var(--text-muted); margin-top:8px; }
  .confirm-row button{ border:none; border-radius:6px; padding:4px 8px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .confirm-row .yes{ background: var(--rose); color:#fff; }
  .confirm-row .no{ background: rgba(243,239,228,0.1); color: var(--text-muted); }

  .steps-toggle{
    margin-top:8px; font-size:11.5px; font-weight:700; color: var(--text-faint);
    background:none; border:none; cursor:pointer; padding:2px 0; display:flex; align-items:center; gap:4px;
  }
  .steps-toggle:hover{ color: var(--text-muted); }
  .steps-list{ margin-top:8px; padding-left:2px; border-left: 2px solid var(--border); padding-left:10px; }
  .step-row{ display:flex; align-items:center; gap:8px; padding: 4px 0; }
  .step-check{
    width:16px; height:16px; border-radius:5px; border:2px solid var(--border-strong);
    flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:transparent;
  }
  .step-check.done{ border-color: var(--teal); color: var(--teal); background: rgba(95,175,162,0.12); }
  .step-check.done::after{ content:"✓"; }
  .step-text{ font-size:12.5px; color: var(--text-muted); }
  .step-text.done{ text-decoration: line-through; color: var(--text-faint); }

  .empty-state{ text-align:center; padding: 40px 20px; color: var(--text-faint); }
  .empty-state .big{ font-size: 30px; margin-bottom:8px; }
  .empty-state p{ font-size:13px; line-height:1.6; max-width:340px; margin: 4px auto 0; }

  .fab{
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%); max-width: 560px; width: calc(100% - 32px);
    display:flex; justify-content:flex-end; pointer-events:none;
  }
  .fab button{
    pointer-events:auto; background: var(--gold); color: #24190A; border:none;
    font-weight: 700; font-size: 14px; padding: 13px 20px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35); cursor:pointer; display:flex; align-items:center; gap:6px;
  }

  .overlay{
    position: fixed; inset:0; background: rgba(10,14,11,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index: 50; animation: fadein .15s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  @keyframes fadein{ from{opacity:0} to{opacity:1} }
  .sheet{
    background: var(--bg-raised); border: 1px solid var(--border-strong);
    border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
    padding: 20px 18px 26px; animation: slideup .18s ease;
    max-height: 85vh; overflow-y:auto;
  }
  @keyframes slideup{ from{ transform: translateY(24px); opacity:0 } to{ transform: translateY(0); opacity:1 } }
  .sheet h3{ font-family: var(--font-display); font-size: 18px; margin: 0 0 16px; }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-size: 11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--text-faint); margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%; background: var(--bg-card); border: 1px solid var(--border-strong);
    color: var(--text); font-size: 15px; padding: 11px 12px; border-radius: 10px; font-family: var(--font-body);
  }
  .field input[type=text]:focus{ outline: none; border-color: var(--gold); }
  .field-hint{ font-size:11px; color: var(--text-faint); margin-top:5px; }
  .seg{ display:flex; gap:6px; }
  .seg button{
    flex:1; padding: 9px 6px; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--bg-card); color: var(--text-muted); font-size: 13px; font-weight:600; cursor:pointer;
  }
  .seg button.sel{ background: var(--gold); color:#24190A; border-color: var(--gold); }
  .cat-select{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-select .chip{ margin:0; }

  .step-edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .step-edit-row .step-text{ flex:1; color: var(--text); font-size:13.5px; }
  .step-edit-row .rm{ background:none; border:none; color: var(--text-faint); cursor:pointer; font-size:15px; padding:2px 6px; }
  .step-edit-row .rm:hover{ color: var(--rose); }
  .add-step-row{ display:flex; gap:8px; margin-top:4px; }
  .add-step-row input{
    flex:1; background: var(--bg-card); border: 1px solid var(--border-strong);
    color: var(--text); padding: 9px 11px; border-radius: 9px; font-size:13.5px; font-family: var(--font-body);
  }
  .add-step-row button{
    background: rgba(217,169,78,0.15); color: var(--gold); border:1px solid rgba(217,169,78,0.35);
    border-radius:9px; padding: 0 14px; font-weight:700; font-size:13px; cursor:pointer;
  }

  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding: 12px; border-radius: 10px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; font-family: var(--font-body); }
  .btn.primary{ background: var(--gold); color:#24190A; }
  .btn.ghost{ background: transparent; color: var(--text-muted); border: 1px solid var(--border-strong); }

  .add-cat-inline{ display:flex; gap:8px; margin: 4px 2px 14px; }
  .add-cat-inline input{
    flex:1; background: var(--bg-card); border: 1px solid var(--border-strong); color: var(--text);
    padding: 9px 12px; border-radius: 9px; font-size:13.5px; font-family: var(--font-body);
  }
  .add-cat-inline button{ background: var(--gold); color:#24190A; border:none; border-radius:9px; padding: 0 16px; font-weight:700; font-size:13px; cursor:pointer; }

  .toast{
    position: fixed; top: calc(16px + env(safe-area-inset-top)); left:50%; transform: translateX(-50%);
    background: var(--bg-card); border:1px solid var(--border-strong); color: var(--text); font-size: 13px;
    padding: 10px 16px; border-radius: 10px; z-index: 80; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    max-width: 90%; text-align:center;
  }

  .install-hint{
    margin: -6px 2px 16px; font-size:11.5px; color: var(--text-faint); line-height:1.5;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
    display:flex; gap:8px; align-items:flex-start;
  }
  .install-hint .x{ margin-left:auto; cursor:pointer; color: var(--text-faint); font-weight:700; flex:0 0 auto; }
</style>
</head>
<body>
<div id="app">Loading…</div>

<script>
const STORAGE_KEY = 'habit-menu-data';

const PALETTE = ['#6B9C7D','#7C93B8','#D9A94E','#8E7CC3','#C97C86','#4F8A8B','#C97B4A','#8AA6A0','#B08968','#7E9CD8'];

const STATUS_LABEL = { idea:'Ideas', active:'Active', struggling:'Struggling', mastered:'Mastered' };
const STATUS_ICON  = { idea:'💡', active:'🌱', struggling:'🔄', mastered:'🏆' };

function cid(){ return 'c_' + Math.random().toString(36).slice(2,10); }
function hid(){ return 'h_' + Math.random().toString(36).slice(2,10); }
function sid(){ return 's_' + Math.random().toString(36).slice(2,10); }

function defaultCategories(){
  return [
    { id: cid(), name: 'Health & Fitness', color: PALETTE[0] },
    { id: cid(), name: 'Mental Wellbeing', color: PALETTE[1] },
    { id: cid(), name: 'Productivity & Work', color: PALETTE[2] },
    { id: cid(), name: 'Learning & Growth', color: PALETTE[3] },
    { id: cid(), name: 'Relationships', color: PALETTE[4] },
    { id: cid(), name: 'Home & Finance', color: PALETTE[5] },
    { id: cid(), name: 'Creativity & Hobbies', color: PALETTE[6] },
  ];
}

let state = { categories: [], habits: [] };

let ui = {
  tab: 'idea',
  catFilter: null,
  manageCats: false,
  confirmDeleteHabit: null,
  confirmDeleteCat: null,
  sheet: null,
  expandedSteps: {},
  loaded: false,
  showInstallHint: true,
};

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.categories = (parsed.categories && parsed.categories.length) ? parsed.categories : defaultCategories();
      state.habits = (parsed.habits || []).map(h => ({ steps: [], ...h }));
    } else {
      state.categories = defaultCategories();
      state.habits = [];
      await persist();
    }
  } catch(e){
    state.categories = defaultCategories();
    state.habits = [];
    try{ await persist(); }catch(e2){}
  }
  ui.loaded = true;
  render();
}

async function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({categories: state.categories, habits: state.habits}));
  } catch(e){
    showToast("Couldn't save — your browser may be blocking storage");
  }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 1800);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function catById(id){ return state.categories.find(c => c.id === id); }

function importanceDots(level){
  const map = {Low:1, Medium:2, High:3};
  const n = map[level] || 1;
  let dots = '';
  for(let i=0;i<3;i++) dots += `<span class="d ${i<n?'on':''}"></span>`;
  return `<span class="imp">${dots}</span><span class="imp-label">${level}</span>`;
}

function setTab(tab){ ui.tab = tab; render(); }
function toggleCatFilter(id){ ui.catFilter = (ui.catFilter === id) ? null : id; render(); }

async function moveHabit(habitId, newStatus, cardEl){
  const h = state.habits.find(x => x.id === habitId);
  if(!h) return;
  if(cardEl){ cardEl.classList.add('leaving'); await new Promise(r => setTimeout(r, 140)); }
  h.status = newStatus;
  await persist();
  render();
}

async function quickSetCategory(habitId, categoryId){
  const h = state.habits.find(x => x.id === habitId);
  if(!h) return;
  h.categoryId = categoryId;
  await persist();
  render();
}

function toggleStepsExpanded(habitId){
  ui.expandedSteps[habitId] = !ui.expandedSteps[habitId];
  render();
}

async function toggleStepDone(habitId, stepId){
  const h = state.habits.find(x => x.id === habitId);
  if(!h) return;
  const s = (h.steps||[]).find(x => x.id === stepId);
  if(!s) return;
  s.done = !s.done;
  await persist();
  render();
}

function openAddSheet(){
  if(state.categories.length === 0){ showToast('Add a category first'); return; }
  ui.sheet = {
    mode: 'add',
    draft: { name:'', categoryId: ui.catFilter || state.categories[0].id, importance: 'Medium', steps: [] }
  };
  render();
}

function openEditSheet(habitId){
  const h = state.habits.find(x => x.id === habitId);
  if(!h) return;
  ui.sheet = { mode:'edit', habitId, draft: { name: h.name, categoryId: h.categoryId, importance: h.importance, steps: (h.steps||[]).map(s=>({...s})) } };
  render();
}

function closeSheet(){ ui.sheet = null; render(); }

function addDraftStep(){
  const input = document.getElementById('newStepInput');
  const text = (input.value || '').trim();
  if(!text) return;
  ui.sheet.draft.steps.push({ id: sid(), text, done:false });
  input.value = '';
  render();
}

function removeDraftStep(stepId){
  ui.sheet.draft.steps = ui.sheet.draft.steps.filter(s => s.id !== stepId);
  render();
}

async function saveSheet(){
  const d = ui.sheet.draft;
  const name = (d.name || '').trim();
  if(!name){ showToast('Give the habit a name'); return; }
  if(ui.sheet.mode === 'add'){
    state.habits.push({ id: hid(), name, categoryId: d.categoryId, importance: d.importance, status: 'idea', steps: d.steps });
  } else {
    const h = state.habits.find(x => x.id === ui.sheet.habitId);
    if(h){ h.name = name; h.categoryId = d.categoryId; h.importance = d.importance; h.steps = d.steps; }
  }
  await persist();
  ui.sheet = null;
  render();
}

function askDeleteHabit(id){ ui.confirmDeleteHabit = id; render(); }
function cancelDeleteHabit(){ ui.confirmDeleteHabit = null; render(); }
async function confirmDeleteHabit(id){
  state.habits = state.habits.filter(h => h.id !== id);
  ui.confirmDeleteHabit = null;
  await persist();
  render();
}

function toggleManageCats(){ ui.manageCats = !ui.manageCats; render(); }

async function addCategoryFromInput(){
  const input = document.getElementById('newCatInput');
  const name = (input.value || '').trim();
  if(!name) return;
  const usedColors = state.categories.map(c=>c.color);
  const color = PALETTE.find(p => !usedColors.includes(p)) || PALETTE[state.categories.length % PALETTE.length];
  state.categories.push({ id: cid(), name, color });
  input.value = '';
  await persist();
  render();
}

function askDeleteCategory(id){ ui.confirmDeleteCat = id; render(); }
function cancelDeleteCategory(){ ui.confirmDeleteCat = null; render(); }
async function confirmDeleteCategory(id){
  state.categories = state.categories.filter(c => c.id !== id);
  state.habits = state.habits.filter(h => h.categoryId !== id);
  if(ui.catFilter === id) ui.catFilter = null;
  ui.confirmDeleteCat = null;
  await persist();
  render();
}

function dismissInstallHint(){ ui.showInstallHint = false; render(); }

function isIOS(){
  return /iP(hone|od|ad)/.test(navigator.platform) ||
    (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
}
function isStandalone(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function leftControl(h){
  if(ui.tab === 'idea'){
    return `<div class="check" onclick="moveHabit('${h.id}','active', document.getElementById('card-${h.id}'))" title="Start this habit"></div>`;
  }
  if(ui.tab === 'active'){
    return `<div class="check checked" onclick="moveHabit('${h.id}','idea', document.getElementById('card-${h.id}'))" title="Move back to ideas"></div>`;
  }
  return `<div class="status-icon">${STATUS_ICON[h.status]}</div>`;
}

function rightActions(h){
  let extra = '';
  if(ui.tab === 'active'){
    extra += `<button class="icon-btn gold" title="Mark as mastered" onclick="moveHabit('${h.id}','mastered', document.getElementById('card-${h.id}'))">🏆</button>`;
    extra += `<button class="icon-btn" title="Couldn't maintain it" onclick="moveHabit('${h.id}','struggling', document.getElementById('card-${h.id}'))">🔄</button>`;
  } else if(ui.tab === 'struggling'){
    extra += `<button class="icon-btn teal" title="Retrieve — back to active" onclick="moveHabit('${h.id}','active', document.getElementById('card-${h.id}'))">↩</button>`;
  } else if(ui.tab === 'mastered'){
    extra += `<button class="icon-btn teal" title="Work on it again" onclick="moveHabit('${h.id}','active', document.getElementById('card-${h.id}'))">🌱</button>`;
  }
  return `${extra}
    <button class="icon-btn" title="Edit" onclick="openEditSheet('${h.id}')">✎</button>
    <button class="icon-btn danger" title="Delete" onclick="askDeleteHabit('${h.id}')">🗑</button>`;
}

function emptyStateFor(tab, hasFilter){
  const suffix = hasFilter ? ' in this category' : '';
  const copy = {
    idea: { icon:'💡', text: `No ideas here yet${suffix}. Tap "Add habit" below whenever something comes to mind.` },
    active: { icon:'🌱', text: `Nothing active yet${suffix}. Check off a habit in Ideas when you're ready to start it.` },
    struggling: { icon:'🔄', text: `Nothing here${suffix}. When a habit isn't sticking, move it here from Active — you can retrieve it any time you're ready to try again.` },
    mastered: { icon:'🏆', text: `Your proud list is empty${suffix}. Once a habit has really stuck, mark it mastered from the Active tab.` },
  };
  const c = copy[tab];
  return `<div class="empty-state"><div class="big">${c.icon}</div><p>${c.text}</p></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!ui.loaded){ app.innerHTML = '<div style="padding:40px;text-align:center;color:#A9B7AC;">Loading…</div>'; return; }

  const visibleHabits = state.habits.filter(h => h.status === ui.tab && (!ui.catFilter || h.categoryId === ui.catFilter));
  const counts = { idea:0, active:0, struggling:0, mastered:0 };
  state.habits.forEach(h => { if(counts[h.status] !== undefined) counts[h.status]++; });

  let html = '';
  html += `
    <header>
      <h1>Habit Menu</h1>
      <p>Drop in every habit idea you get. When you've got the energy, open <b>Ideas</b> and pick one that fits your mood.</p>
    </header>
  `;

  if(ui.showInstallHint && isIOS() && !isStandalone()){
    html += `
      <div class="install-hint">
        <span>📲</span>
        <span>On iPhone: tap the Share icon in Safari, then "Add to Home Screen" to open this like an app. Your data is saved in this browser, so always open it the same way (same icon or same link) to see it.</span>
        <span class="x" onclick="dismissInstallHint()">✕</span>
      </div>
    `;
  }

  html += `<div class="tabbar">`;
  ['idea','active','struggling','mastered'].forEach(t => {
    html += `<button data-tab="${t}" class="${ui.tab===t?'active':''}" onclick="setTab('${t}')">
      <span class="ic">${STATUS_ICON[t]}</span>
      <span>${STATUS_LABEL[t]}</span>
      <span class="count">${counts[t]}</span>
    </button>`;
  });
  html += `</div>`;

  // category chip row
  html += `<div class="cat-row">`;
  html += `<div class="chip ${ui.catFilter===null?'selected':''}" onclick="toggleCatFilter(null)">All</div>`;
  state.categories.forEach(c => {
    if(ui.manageCats){
      html += `<div class="chip ${ui.catFilter===c.id?'selected':''}">
        <span class="dot" style="background:${c.color}"></span>
        <span onclick="toggleCatFilter('${c.id}')">${esc(c.name)}</span>
        <span class="x" onclick="event.stopPropagation();askDeleteCategory('${c.id}')">✕</span>
      </div>`;
    } else {
      html += `<div class="chip ${ui.catFilter===c.id?'selected':''}" onclick="toggleCatFilter('${c.id}')">
        <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      </div>`;
    }
  });
  html += `</div>`;

  html += `<div class="manage-row"><button class="link-btn" onclick="toggleManageCats()">${ui.manageCats ? 'Done editing categories' : 'Edit categories'}</button></div>`;

  if(ui.manageCats){
    html += `
      <div class="add-cat-inline">
        <input id="newCatInput" type="text" placeholder="New category name" onkeydown="if(event.key==='Enter'){addCategoryFromInput()}">
        <button onclick="addCategoryFromInput()">Add</button>
      </div>
    `;
    if(ui.confirmDeleteCat){
      const c = catById(ui.confirmDeleteCat);
      if(c){
        html += `<div class="confirm-row" style="margin-bottom:14px;">Delete "${esc(c.name)}" and its habits?
          <button class="yes" onclick="confirmDeleteCategory('${c.id}')">Delete</button>
          <button class="no" onclick="cancelDeleteCategory()">Cancel</button>
        </div>`;
      }
    }
  }

  if(visibleHabits.length === 0){
    html += emptyStateFor(ui.tab, !!ui.catFilter);
  } else {
    const cats = ui.catFilter ? state.categories.filter(c=>c.id===ui.catFilter) : state.categories;
    cats.forEach(c => {
      const items = visibleHabits.filter(h => h.categoryId === c.id);
      if(items.length === 0) return;
      html += `<div class="cat-group"><h2><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</h2>`;
      items.forEach(h => {
        const steps = h.steps || [];
        const doneCount = steps.filter(s=>s.done).length;
        const expanded = !!ui.expandedSteps[h.id];
        html += `<div class="habit-card" id="card-${h.id}">
          <div class="habit-top">
            ${leftControl(h)}
            <div class="habit-main">
              <p class="habit-name">${esc(h.name)}</p>
              <div class="habit-meta">
                ${importanceDots(h.importance)}
                <select class="cat-pill" style="border-color:${catById(h.categoryId)?catById(h.categoryId).color:'var(--border-strong)'}" onchange="quickSetCategory('${h.id}', this.value)" title="Change category">
                  ${state.categories.map(c2 => `<option value="${c2.id}" ${c2.id===h.categoryId?'selected':''}>${esc(c2.name)}</option>`).join('')}
                </select>
              </div>
              ${steps.length ? `<button class="steps-toggle" onclick="toggleStepsExpanded('${h.id}')">${expanded?'▾':'▸'} ${doneCount}/${steps.length} small steps</button>` : ''}
              ${expanded && steps.length ? `<div class="steps-list">${steps.map(s => `
                <div class="step-row">
                  <div class="step-check ${s.done?'done':''}" onclick="toggleStepDone('${h.id}','${s.id}')"></div>
                  <span class="step-text ${s.done?'done':''}">${esc(s.text)}</span>
                </div>`).join('')}</div>` : ''}
              ${ui.confirmDeleteHabit === h.id ? `
                <div class="confirm-row">Delete this habit?
                  <button class="yes" onclick="confirmDeleteHabit('${h.id}')">Delete</button>
                  <button class="no" onclick="cancelDeleteHabit()">Cancel</button>
                </div>` : ''}
            </div>
            <div class="habit-actions">${rightActions(h)}</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }

  html += `<div style="height:70px"></div>`;
  html += `<div class="fab"><button onclick="openAddSheet()"><span style="font-size:17px;">+</span> Add habit</button></div>`;

  if(ui.sheet){
    const d = ui.sheet.draft;
    html += `
      <div class="overlay" onclick="if(event.target===this) closeSheet()">
        <div class="sheet">
          <h3>${ui.sheet.mode==='add' ? 'Add a habit' : 'Edit habit'}</h3>
          <div class="field">
            <label>Habit</label>
            <input type="text" id="habitNameInput" value="${esc(d.name)}" placeholder="e.g. Get fit" oninput="ui.sheet.draft.name=this.value">
          </div>
          <div class="field">
            <label>Category</label>
            <div class="cat-select">
              ${state.categories.map(c => `
                <div class="chip ${d.categoryId===c.id?'selected':''}" onclick="ui.sheet.draft.categoryId='${c.id}';render();">
                  <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
                </div>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label>Importance</label>
            <div class="seg">
              ${['Low','Medium','High'].map(lvl => `
                <button class="${d.importance===lvl?'sel':''}" onclick="ui.sheet.draft.importance='${lvl}';render();">${lvl}</button>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label>Break it into small steps</label>
            <div class="field-hint" style="margin-top:-2px;margin-bottom:8px;">Optional — split a big habit like "Get fit" into small pieces like "Put on shoes", "Walk 5 minutes".</div>
            ${d.steps.map(s => `
              <div class="step-edit-row">
                <div class="step-check"></div>
                <span class="step-text">${esc(s.text)}</span>
                <button class="rm" onclick="removeDraftStep('${s.id}')">✕</button>
              </div>
            `).join('')}
            <div class="add-step-row">
              <input type="text" id="newStepInput" placeholder="Add a small step" onkeydown="if(event.key==='Enter'){event.preventDefault();addDraftStep()}">
              <button onclick="addDraftStep()">Add</button>
            </div>
          </div>
          <div class="sheet-actions">
            <button class="btn ghost" onclick="closeSheet()">Cancel</button>
            <button class="btn primary" onclick="saveSheet()">${ui.sheet.mode==='add' ? 'Add habit' : 'Save changes'}</button>
          </div>
        </div>
      </div>
    `;
  }

  app.innerHTML = html;
}

loadState();
</script>
</body>
</html>
